name: APK Guard Release

# Push a tag like v1.0.0 to build, sign and publish a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApkGuard
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION file
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG version=$FILE"
          [ "$TAG" = "$FILE" ] || { echo "Tag v$TAG does not match VERSION $FILE"; exit 1; }
          echo "VERSION=$FILE" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Unit tests
        run: ./gradlew :core:test

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.APKGUARD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "APKGUARD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore secret; signing with a throwaway debug key."
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          APKGUARD_KEYSTORE_PASSWORD: ${{ secrets.APKGUARD_KEYSTORE_PASSWORD }}
          APKGUARD_KEY_ALIAS: ${{ secrets.APKGUARD_KEY_ALIAS }}
          APKGUARD_KEY_PASSWORD: ${{ secrets.APKGUARD_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p dist
          OUT="dist/ApkGuard-v$VERSION.apk"
          cp "$SRC" "$OUT"
          "$BT/aapt2" dump badging "$OUT" | head -1 | tee badging.txt
          grep -q "versionName='$VERSION'" badging.txt || { echo "versionName mismatch"; exit 1; }
          "$BT/aapt2" dump permissions "$OUT" | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "INTERNET permission present!"; exit 1; fi
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee signer.txt
          CERT=$(grep -m1 "certificate SHA-256 digest" signer.txt | awk '{print $NF}')
          echo "CERT_SHA256=$CERT" >> "$GITHUB_ENV"
          (cd dist && sha256sum "ApkGuard-v$VERSION.apk" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Write release notes
        run: |
          # Section of CHANGELOG.md for this version (between its heading and the next one).
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?v?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo "Download \`ApkGuard-v$VERSION.apk\` below and open it on your phone."
            echo
            echo "### Verify"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo "Signing certificate SHA-256: \`$CERT_SHA256\`"
            if [ "$SIGNING" = "debug" ]; then
              echo
              echo "> **Note:** signed with a temporary key. Uninstall any previous APK Guard build before installing this one."
            fi
          } >> notes.md
          cat notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ApkGuard-v$VERSION.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "APK Guard v$VERSION" \
            --notes-file notes.md \
            --verify-tag
