name: APK Guard Release

# Publishes a GitHub Release when ApkGuard/VERSION changes (or an apkguard-vX.Y.Z tag is pushed).
# The workflow creates the tag itself, so nobody has to push tags by hand.
on:
  push:
    branches: ["**"]
    paths: ["ApkGuard/VERSION", ".github/workflows/apkguard-release.yml"]
    tags: ["apkguard-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApkGuard
    steps:
      - uses: actions/checkout@v4

      - name: Read version and skip if already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$FILE" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#apkguard-v}" != "$FILE" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $FILE"; exit 1
          fi
          # Tags are namespaced (apkguard-vX.Y.Z) because this repo releases several projects.
          # 1.1.0 and 1.1.1 went out as plain vX.Y.Z before that; don't publish them twice.
          if gh release view "apkguard-v$FILE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
             gh release view "v$FILE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "APK Guard $FILE is already released; nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        if: env.SKIP != '1'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/wrapper-validation@v4
        if: env.SKIP != '1'

      - uses: gradle/actions/setup-gradle@v4
        if: env.SKIP != '1'
        with:
          cache-disabled: true

      - name: Unit tests
        if: env.SKIP != '1'
        run: ./gradlew :core:test

      - name: Decode release key
        if: env.SKIP != '1'
        env:
          SIGNING: ${{ secrets.APKGUARD_SIGNING }}
        run: |
          # One secret holds "password:base64-of-PKCS12-keystore" (alias "apkguard").
          if [ -n "$SIGNING" ]; then
            PW="${SIGNING%%:*}"
            echo "::add-mask::$PW"
            printf '%s' "${SIGNING#*:}" | base64 -d > "$RUNNER_TEMP/release.p12"
            {
              echo "APKGUARD_KEYSTORE=$RUNNER_TEMP/release.p12"
              echo "APKGUARD_KEYSTORE_PASSWORD=$PW"
              echo "APKGUARD_KEY_PASSWORD=$PW"
              echo "APKGUARD_KEY_ALIAS=apkguard"
              echo "SIGNING=release"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No APKGUARD_SIGNING secret; signing with a throwaway debug key."
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        if: env.SKIP != '1'
        run: ./gradlew :app:assembleRelease

      - name: Verify APK
        if: env.SKIP != '1'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p dist
          OUT="dist/ApkGuard-v$VERSION.apk"
          cp "$SRC" "$OUT"
          "$BT/aapt2" dump badging "$OUT" | head -1 | tee badging.txt
          grep -q "versionName='$VERSION'" badging.txt || { echo "versionName mismatch"; exit 1; }
          "$BT/aapt2" dump permissions "$OUT" | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "INTERNET permission present!"; exit 1; fi
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee signer.txt
          CERT=$(grep -m1 "certificate SHA-256 digest" signer.txt | awk '{print $NF}')
          echo "CERT_SHA256=$CERT" >> "$GITHUB_ENV"
          (cd dist && sha256sum "ApkGuard-v$VERSION.apk" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Write release notes
        if: env.SKIP != '1'
        run: |
          # Section of CHANGELOG.md for this version (between its heading and the next one).
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?v?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo "Download \`ApkGuard-v$VERSION.apk\` below and open it on your phone."
            echo
            echo "### Verify"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo "Signing certificate SHA-256: \`$CERT_SHA256\`"
            if [ "$SIGNING" = "debug" ]; then
              echo
              echo "> **Note:** signed with a temporary key. Uninstall any previous APK Guard build before installing this one."
            fi
          } >> notes.md
          cat notes.md

      - name: Publish GitHub Release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apkguard-v$VERSION" dist/ApkGuard-v$VERSION.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "APK Guard v$VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
