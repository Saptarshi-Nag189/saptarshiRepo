name: LyricStage Release

# Publishes a GitHub Release when VERSION changes (or a lyricstage-vX.Y.Z tag is pushed).
# The workflow creates the tag itself, so nobody has to push tags by hand.
# Tags are prefixed "lyricstage-" so they never clash with other apps in this repository.
on:
  push:
    branches: ["**"]
    paths: ["VERSION", ".github/workflows/lyricstage-release.yml"]
    tags: ["lyricstage-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Read version and skip if already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$FILE" >> "$GITHUB_ENV"
          echo "TAG=lyricstage-v$FILE" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#lyricstage-v}" != "$FILE" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $FILE"; exit 1
          fi
          if gh release view "lyricstage-v$FILE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "lyricstage-v$FILE is already released; nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        if: env.SKIP != '1'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/wrapper-validation@v4
        if: env.SKIP != '1'

      - uses: gradle/actions/setup-gradle@v4
        if: env.SKIP != '1'
        with:
          cache-disabled: true

      - name: Unit tests
        if: env.SKIP != '1'
        run: ./gradlew -PcoreOnly :core:test

      - name: Decode release keystore
        if: env.SKIP != '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.LYRICSTAGE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LYRICSTAGE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore secret; signing with a throwaway debug key."
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        if: env.SKIP != '1'
        env:
          LYRICSTAGE_KEYSTORE_PASSWORD: ${{ secrets.LYRICSTAGE_KEYSTORE_PASSWORD }}
          LYRICSTAGE_KEY_ALIAS: ${{ secrets.LYRICSTAGE_KEY_ALIAS }}
          LYRICSTAGE_KEY_PASSWORD: ${{ secrets.LYRICSTAGE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify APK
        if: env.SKIP != '1'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p dist
          OUT="dist/LyricStage-v$VERSION.apk"
          cp "$SRC" "$OUT"
          "$BT/aapt2" dump badging "$OUT" | head -1 | tee badging.txt
          grep -q "versionName='$VERSION'" badging.txt || { echo "versionName mismatch"; exit 1; }
          # LRCLIB is the only network use: INTERNET is expected, nothing else that is dangerous
          "$BT/aapt2" dump permissions "$OUT" | tee perms.txt
          if grep -E "READ_CONTACTS|ACCESS_FINE_LOCATION|RECORD_AUDIO|READ_SMS|CAMERA" perms.txt; then
            echo "Unexpected permission"; exit 1
          fi
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | tee signer.txt
          CERT=$(grep -m1 "certificate SHA-256 digest" signer.txt | awk '{print $NF}')
          echo "CERT_SHA256=$CERT" >> "$GITHUB_ENV"
          (cd dist && sha256sum "LyricStage-v$VERSION.apk" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Write release notes
        if: env.SKIP != '1'
        run: |
          # Section of CHANGELOG.md for this version (between its heading and the next one).
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?v?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo "Download \`LyricStage-v$VERSION.apk\` below and open it on your phone."
            echo "Then open LyricStage and allow notification access when asked."
            echo
            echo "### Verify"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo "Signing certificate SHA-256: \`$CERT_SHA256\`"
            if [ "$SIGNING" = "debug" ]; then
              echo
              echo "> **Note:** signed with a temporary key. Uninstall any previous LyricStage build before installing this one."
            fi
          } >> notes.md
          cat notes.md

      - name: Publish GitHub Release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "dist/LyricStage-v$VERSION.apk" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "LyricStage v$VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
